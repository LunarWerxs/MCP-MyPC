name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - name: The server starts and lists its tools
        shell: bash
        env:
          MYPC_HOME: ${{ runner.temp }}/mypc
        run: echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node bin/mypc.mjs stdio | grep -q '"run_command"'
