<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
<title id="t">mypc in a terminal</title>
<desc id="d">A terminal replays real mypc output. "mypc family create" prints a family code (a made-up example: MYPC-7K2Q-9XWM-4TRD-HP3C-QJ6V-A8NE-5BZK-2YGF) with how to share it and a reminder to keep it private. Then "mypc status" shows MCP-MyPC 0.1.0 on "Mom's PC", Background helper: running, Family: joined, connected, ChatGPT link: off, the settings folder, and that no other family computer is online right now.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1B2A"/><stop offset="1" stop-color="#0a1624"/></linearGradient>
<radialGradient id="glow" cx=".15" cy="0" r=".9"><stop offset="0" stop-color="#5b9bd8" stop-opacity=".16"/><stop offset="1" stop-color="#5b9bd8" stop-opacity="0"/></radialGradient>
<clipPath id="win"><rect width="900" height="560" rx="14"/></clipPath>
<clipPath id="ty0"><rect x="44.4" y="54" width="147.6" height="25"><animate attributeName="width" calcMode="discrete" values="0;8.2;16.4;24.6;32.8;41.0;49.2;57.4;65.6;73.8;82.0;90.2;98.4;106.6;114.8;123.0;131.2;139.4;147.6;0" keyTimes="0;0.0515;0.0559;0.0603;0.0647;0.0691;0.0735;0.0779;0.0824;0.0868;0.0912;0.0956;0.1000;0.1044;0.1088;0.1132;0.1176;0.1221;0.1265;0.9588" dur="17.0s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="ty11"><rect x="44.4" y="329" width="90.2" height="25"><animate attributeName="width" calcMode="discrete" values="0;8.2;16.4;24.6;32.8;41.0;49.2;57.4;65.6;73.8;82.0;90.2;0" keyTimes="0;0.3691;0.3735;0.3779;0.3824;0.3868;0.3912;0.3956;0.4000;0.4044;0.4088;0.4132;0.9588" dur="17.0s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#win)">
<rect width="900" height="560" fill="url(#bg)"/>
<rect width="900" height="560" fill="url(#glow)"/>
<rect width="900" height="40" fill="#15304D"/>
<path d="M0 40.5H900" stroke="#2E5F92" stroke-width="1"/>
<circle cx="22" cy="20" r="6" fill="#E8492F"/>
<circle cx="42" cy="20" r="6" fill="#E9B949"/>
<circle cx="62" cy="20" r="6" fill="#4DB57A"/>
<text x="450.0" y="25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#93a9ba">mypc</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" xml:space="preserve">
<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9294;0.9588;1" dur="17.0s" repeatCount="indefinite"/>
<g><text x="28.0" y="72" textLength="8.2" lengthAdjust="spacing" fill="#E8492F" font-weight="700">$</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1794;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="347" textLength="8.2" lengthAdjust="spacing" fill="#E8492F" font-weight="700">$</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5191;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="547" textLength="8.2" lengthAdjust="spacing" fill="#E8492F" font-weight="700">$</text></g>
<g clip-path="url(#ty0)"><text x="44.4" y="72" textLength="147.6" lengthAdjust="spacing" fill="#FCFCFC" font-weight="600">mypc family create</text></g>
<g clip-path="url(#ty11)"><text x="44.4" y="347" textLength="90.2" lengthAdjust="spacing" fill="#FCFCFC" font-weight="600">mypc status</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1500;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="97" textLength="246.0" lengthAdjust="spacing" fill="#c3d2e0">Created a family. Its code is:</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1524;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="60.8" y="147" textLength="360.8" lengthAdjust="spacing" fill="#89C0EB" font-weight="700">MYPC-7K2Q-9XWM-4TRD-HP3C-QJ6V-A8NE-5BZK-2YGF</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1547;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="197" textLength="631.4" lengthAdjust="spacing" fill="#c3d2e0">Send it to the other person (a text message is fine). On their computer, run:</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1571;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="60.8" y="222" textLength="131.2" lengthAdjust="spacing" fill="#FCFCFC">mypc family join</text><text x="200.2" y="222" textLength="360.8" lengthAdjust="spacing" fill="#89C0EB">MYPC-7K2Q-9XWM-4TRD-HP3C-QJ6V-A8NE-5BZK-2YGF</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1594;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="247" textLength="828.2" lengthAdjust="spacing" fill="#c3d2e0">(or tell their AI: "join my MCP-MyPC family with code MYPC-7K2Q-9XWM-4TRD-HP3C-QJ6V-A8NE-5BZK-2YGF").</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1618;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="297" textLength="639.6" lengthAdjust="spacing" fill="#F29A83">Keep the code private: anyone who has it can use every computer in the family.</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4368;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="372" textLength="229.6" lengthAdjust="spacing" fill="#FCFCFC" font-weight="600">MCP-MyPC 0.1.0 on "Mom's PC"</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4382;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="397" textLength="147.6" lengthAdjust="spacing" fill="#93a9ba">Background helper:</text><text x="183.8" y="397" textLength="57.4" lengthAdjust="spacing" fill="#7CCBA2" font-weight="600">running</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4397;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="422" textLength="57.4" lengthAdjust="spacing" fill="#93a9ba">Family:</text><text x="93.6" y="422" textLength="139.4" lengthAdjust="spacing" fill="#7CCBA2" font-weight="600">joined, connected</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4426;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="447" textLength="106.6" lengthAdjust="spacing" fill="#93a9ba">ChatGPT link:</text><text x="142.8" y="447" textLength="24.6" lengthAdjust="spacing" fill="#c3d2e0">off</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4456;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="472" textLength="131.2" lengthAdjust="spacing" fill="#93a9ba">Settings folder:</text><text x="167.4" y="472" textLength="180.4" lengthAdjust="spacing" fill="#c3d2e0">C:\Users\Mom\.mcp-mypc</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4956;0.9588" dur="17.0s" repeatCount="indefinite"/><text x="28.0" y="497" textLength="820.0" lengthAdjust="spacing" fill="#c3d2e0">No other family computer is online right now. They show up while they are switched on and signed in.</text></g>
<g><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;.5" dur="1.1s" repeatCount="indefinite"/>
