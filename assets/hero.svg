<text x="80" y="186" font-size="78" font-weight="700" letter-spacing="-1" fill="#FCFCFC">MCP-<tspan fill="url(#title)">MyPC</tspan></text>
<text x="82" y="240" font-size="31" font-weight="600" fill="#FCFCFC">Let your AI use your computer,</text>
<text x="82" y="280" font-size="31" font-weight="600" fill="#89C0EB">and your family's.</text>
<text x="83" y="324" font-size="17" fill="#93a9ba">No VPN, no port forwarding, no router settings.</text>
