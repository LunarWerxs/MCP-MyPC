<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10263f"/><stop offset="1" stop-color="#0a1829"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#89C0EB" fill-opacity=".09"/></pattern>
<radialGradient id="pkt"><stop offset="0" stop-color="#FCFCFC"/><stop offset=".35" stop-color="#89C0EB" stop-opacity=".9"/><stop offset="1" stop-color="#89C0EB" stop-opacity="0"/></radialGradient>
<radialGradient id="roomglow"><stop offset="0" stop-color="#5b9bd8" stop-opacity=".35"/><stop offset="1" stop-color="#5b9bd8" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1200" height="520" rx="22"/></clipPath>
