<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">How MCP-MyPC works</title>
<desc id="d">On Mom's PC, the AI app (Claude app, Claude Code or Codex) starts mypc, the MCP server, and talks to it over stdio on the same computer. mypc and the background helper on Brother's PC each hold an encrypted WebSocket to the family room on the relay, a Cloudflare Worker. Family messages are end-to-end encrypted with the family code: the relay only passes sealed messages. Separately, ChatGPT reaches a computer through its ChatGPT link: HTTPS to the relay, then a WebSocket to the helper on that computer. That path is not end-to-end encrypted.</desc>
