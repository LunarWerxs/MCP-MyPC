<text x="894" y="153" font-size="16" fill="#89C0EB" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">mypc agent</text>
<text x="894" y="186" font-size="16" fill="#c3d2e0">starts at every sign-in</text>
<text x="894" y="208" font-size="16" fill="#c3d2e0">stays connected</text>
<text x="894" y="230" font-size="16" fill="#c3d2e0">to the relay</text>
<text x="894" y="262" font-size="16" fill="#FCFCFC" font-weight="600">runs the tools right here</text>
<rect x="876" y="312" width="280" height="40" rx="12" fill="#15304D" fill-opacity=".3" stroke="#2E5F92" stroke-width="1.3"/>
<path d="M896 322h10l5 5v15h-15z" fill="none" stroke="#89C0EB" stroke-width="1.5" stroke-linejoin="round"/><path d="M899 331h9M899 336h9" stroke="#89C0EB" stroke-width="1.3"/>
