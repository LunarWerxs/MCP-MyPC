<text x="756" y="477" font-size="16" fill="#93a9ba">turned on with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" fill="#89C0EB">mypc chatgpt on</tspan></text>
<text x="44" y="430" font-size="16" fill="#93a9ba">Mom's PC runs its own helper too,</text>
