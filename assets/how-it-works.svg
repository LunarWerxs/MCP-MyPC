<text x="488" y="173" font-size="16" fill="#c3d2e0">end-to-end encrypted with</text>
<text x="488" y="195" font-size="16" fill="#c3d2e0">the family code: the relay</text>
<text x="488" y="217" font-size="16" fill="#c3d2e0">only passes sealed messages</text>
<text x="488" y="246" font-size="16" fill="#93a9ba">It never sees the code.</text>
